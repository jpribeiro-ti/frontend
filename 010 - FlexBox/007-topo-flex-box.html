<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;}
        body { background-color: aqua;}
        .container-topo { max-width: 1200px; margin: 40px auto; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 20px; }
        .logo { display: flex; align-items: center; justify-content: space-between;}
        .container-topo img { width: 120px;}
        .container-topo h1 { font-size: 32px; font-weight: 600; margin-left: 20px;}
        .container-topo span { font-size: 14px; margin-left: 20px; color: blue}
        .menu { text-transform: uppercase;}
        .menu a { padding: 5px 10px; text-decoration: none; color:black; font-weight: 700;}
      </style>
  </head>
  <body>
    <div class="container-topo">
      <div class="logo">
        <div>
          <img src="./img/logo-icone.png" alt="Logo" />
        </div>
        <div>
          <h1>AlfaTech</h1>
          <span>Soluções em hospedagem</span>
        </div>
      </div>
      <nav class="menu">
        <a href="#">Informações</a>
        <a href="#">Planos</a>
        <a href="#">Preços</a>
        <a href="#">Contato</a>
      </nav>
    </div>
  </body>
</html>
