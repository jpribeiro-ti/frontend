<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat&display=swap");

      * {
        margin: 0;
        padding: 0;
        font-family: Montserrat;
      }

      .container {
        height: 100vh;
        padding: 60px 0;
        background-color: black;
        display: flex;
        flex-wrap: wrap;
        justify-content:space-evenly;
        align-items: center;
        gap: 20px;
      }

      .card {
        width: 200px;
        height: 200px;
        padding: 10px 20px;
        background-color: white;
        border: 1px solid gray;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        align-items: center;
        flex-grow: 0;
      }

      .card p {
        width: 190px;
      }

      .card img {
        width: 150px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card card-um">
        <h3>Samsung Galaxy M53</h3>
        <img
          src="https://a-static.mlcdn.com.br/800x560/smartphone-samsung-galaxy-s21-fe-128gb-preto-5g-6gb-ram-tela-64-cam-tripla-selfie-32mp/magazineluiza/233990000/e61df17d4e04c633f36b090c51002c08.jpg"
        />
        <small>R$1.599,99</small>
      </div>
      <div class="card card-dois">
        <h3>iPhone 14 Pro</h3>
        <img
          src="https://a-static.mlcdn.com.br/800x560/apple-iphone-14-pro-512gb-prateado-61-48mp-ios-5g/magazineluiza/235924100/55fbd44260ce4c79de317d362b0a16bd.jpg"
        />
        <small>R$5.900,00</small>
      </div>
      <div class="card card-tres">
        <h3>Motorola Edge 30</h3>
        <img
          src="https://a-static.mlcdn.com.br/1500x1500/smartphone-motorola-edge-30-256gb-grafite-5g-octa-core-8gb-ram-65-cam-tripla-selfie-32mp/magazineluiza/235180600/dce1403134f9f60328da7ac5fa749769.jpg"
        />
        <small>R$2.599,99</small>
      </div>
    </div>
  </body>
</html>
