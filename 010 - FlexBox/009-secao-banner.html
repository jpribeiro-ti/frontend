<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box;}
        body { color: #fff; font-family: sans-serif;}
        .secao-banner { width: 100%; padding: 100px 0; background-color: #2f86d6;}
        .container { max-width: 1024px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; flex-wrap: wrap; gap: 20px;}
        .container-texto {    color: #fff; padding: 10px 20px; flex: 1 1 300px; display: flex; flex-direction: column; justify-content: center; gap: 20px;}
        .container-texto p { font-size: 14px; line-height: 25px;}
        .container-texto h2 { font-size: 26px; line-height: 35px; padding: 20px 0;}
        .container-imagem { flex: 1 1 400px; }
        .container-imagem img { width: 100%; height: 100%; }

    </style>
  </head>
  <body>
    <div class="secao-banner">
      <div class="container">
        <div class="container-texto">
          <p>Simples - Fácil de usar - 10x mais rápido!</p>
          <h2>O melhor serviço de hospedagem na web para o seu site.</h2>
          <p>
            Obtenha a melhor velocidade para o seu site. Não perca mais clientes
            por causa da lentidão na sua hospedagem.
          </p>
        </div>
        <div class="container-imagem">
          <img src="./img/imagem-banner.png" alt="Banner" />
        </div>
      </div>
    </div>
  </body>
</html>
