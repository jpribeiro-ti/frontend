<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container-topo {
  background-color: white;
  padding: 35px 50px;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 20px;
}
.container-logo {
  width: 285px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.container-links {
  width: 385px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.container-links a {
  font-weight: 600;
  text-decoration: none;
  color: #233032;
}
.container-logo-imagem {
  width: 100px;
  height: 100px;
}
.container-logo-imagem img {
  width: 100%;
  height: 100%;
}
.container-logo p {
  font-size: 12px;
  font-weight: 600;
  color: #2f86d6;
}
    </style>
</head>
<body>
    <div class="container-topo">
      <div class="container-logo">
        <div class="container-logo-imagem">
          <img src="img/logo-icone.png" />
        </div>
        <div>
          <h1>AlfaTech</h1>
          <p>Soluções em hospedagem</p>
        </div>
      </div>
      <div class="container-links">
        <a href="#informacoes">INFORMAÇÕES</a>
        <a href="#planos">PLANOS</a>
        <a href="#precos">PREÇOS</a>
        <a href="#contato">CONTATO</a>
      </div>
    </div>
  </body>
</html>
