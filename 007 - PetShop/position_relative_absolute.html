<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style type="text/css">
        * { margin: 0px; padding: 0px; box-sizing: content-box; font-family: Montserrat, sans-serif; text-decoration: none;}
        body { background-color: antiquewhite; width: 100%; margin: 0 auto; font-size: 18px;}
        h1 { color: #f00; font-size: 22px; text-align: center; margin-top: 50px}
        h3 { font-weight: bold; margin-bottom: 20px; font-size: 26px;}
        .container { position: relative; width: 700px; background-color: #fff; padding: 20px; margin: 50px auto; padding: 30px 30px 60px; border: 3px solid red; min-height: 110px;}
        .icone { padding: 10px 15px; text-align: center; font-weight: 800; font-size: 25px; background-color: #f00; color: #fff700; border-radius: 50%; position: absolute; top: -30px; left: -25px;  }
        .ingredientes { font-size: 20px; }
        a { border: none; border-radius: 5px; color: #fff700; font-weight: 800; font-size: 18px; background-color: #ff1700; width: 240px; text-align: center; padding: 15px; position: absolute; bottom: -26px; right: 10px; }
            </style>
  </head>
  <body>
    <div class="center">
      <h1>Escolha um combo e faça seu pedido</h1>

      <div class="container">
        <div class="icone">1</div>
        <h3>Pizza alho + Refri 1,5l</h3>
        <p class="ingredientes">
          Massa fininha e crocante com muita muçarela, molho de tomate, alho
          frito, orégano e assada no forno a lenha
        </p>
        <p class="link-pedido"><a href="#"> pedido R$ 41,00</a></p>
      </div>
    </div>
  </body>
</html>
