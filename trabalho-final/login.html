<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Cadastro - Store</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"
      integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="topo"></div>
    <div class="container-topo">
      <img src="./img/logo.jpeg" alt="logo" />
      <nav>
        <a href="index.html">Home</a>
        <a href="cadastro.html">Cadastro</a>
         <a href="#contato">Contato</a>
        <a href="login.html" class="borda">Login</a>
      </nav>
    </div>

    <div class="container-body contato">
      <div class="container bg-white p-5 rounded shadow">
        <h2 class="mb-4 text-center">Login</h2>

        <form
          action="#"
          method="post"
          enctype="application/x-www-form-urlencoded"
        >
          <div class="mb-3">
            <label for="username" class="form-label">Username:</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="form-control"
              placeholder="Digite seu username"
            />
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Senha:</label>
            <input type="password"
             class="form-control"
              required
            />
          </div>


          <div class="d-flex justify-content-between">
            <button type="reset" class="btn btn-secondary">Limpar</button>
            <button type="submit" class="btn btn-primary">Entrar</button>
          </div>
        </form>
      </div>
    </div>
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <p class="mb-0">2025 Store. Todos os direitos reservados</p>
    </footer>
    <script>
      function enviarCadastro(event) {
        event.preventDefault();

        const dados = {
          username: document.getElementById("username").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          role: document.getElementById("role").value,
        };

        console.log(dados);
      }

      document.querySelector("form").addEventListener("submit", enviarCadastro);
    </script>
  </body>
</html>
